name: iOS Production Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      auto_submit:
        description: 'Auto submit to Apple App Store / TestFlight'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Release iOS Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Build iOS Production via EAS Cloud
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_CMD="eas build --platform ios --profile production --non-interactive"
          if [ "${{ inputs.auto_submit }}" = "true" ] || [ -z "${{ github.event.inputs }}" ]; then
            BUILD_CMD="$BUILD_CMD --auto-submit"
          fi
          eval "$BUILD_CMD"
